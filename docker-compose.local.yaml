# Surcouche pour tester l'image en local, hors proxy.
#
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml up --build
#
# A ne pas utiliser sur Coolify : le routage y passe par le proxy, pas par un
# port publie sur l'hote.

services:
  server:
    ports:
      - '${HOST_PORT:-8787}:8787'
    environment:
      # Expose en direct, sans proxy : X-Forwarded-For serait falsifiable.
      TRUST_PROXY: 'false'
