name: ci

# Verifie chaque push sur main et preprod, puis declenche le deploiement Coolify
# de la branche si tout est vert : main -> prod, preprod -> preprod. Le
# deploiement automatique de Coolify doit etre coupe : c'est ce workflow qui
# l'appelle, pour qu'un commit casse n'arrive jamais en prod.
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Les tests posent eux-memes leurs process.env : aucun secret n'est requis.
      - run: npm test
      # Verifie que le bundle desktop compile (esbuild), sans packager.
      - name: Bundle desktop
        run: npm run build --workspace @livememes/desktop

  # Appelle le webhook de deploiement Coolify, uniquement si `verify` est vert.
  # Secrets a creer dans GitHub (Settings > Secrets and variables > Actions) :
  #   preprod : COOLIFY_WEBHOOK / COOLIFY_TOKEN
  #   prod    : COOLIFY_WEBHOOK_PROD / COOLIFY_TOKEN_PROD
  # Webhook = URL "Deploy Webhook" de la ressource (onglet Webhooks), token = API
  # Coolify (Keys & Tokens), permission "deploy". Noms distincts pour la prod :
  # un secret prod oublie fait echouer le job au lieu de deployer main en preprod.
  deploy:
    name: deploiement Coolify (${{ github.ref_name }})
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Declenche le deploiement
        # Choix fait en bash et non par `a && b || c` dans l'expression : un
        # secret prod vide y retomberait sur celui de la preprod.
        env:
          PROD_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_PROD }}
          PROD_TOKEN: ${{ secrets.COOLIFY_TOKEN_PROD }}
          PREPROD_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          PREPROD_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            COOLIFY_WEBHOOK="$PROD_WEBHOOK" COOLIFY_TOKEN="$PROD_TOKEN"
          else
            COOLIFY_WEBHOOK="$PREPROD_WEBHOOK" COOLIFY_TOKEN="$PREPROD_TOKEN"
          fi
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Secrets Coolify manquants pour ${GITHUB_REF_NAME} : rien n'a ete deploye."
            exit 1
          fi
          # Coolify n'accepte plus que POST sur ce webhook (GET -> 405).
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
