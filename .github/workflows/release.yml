name: release

# Se declenche sur un tag v* (ex. v0.1.0-beta.1). En manuel, lance le workflow
# en choisissant le tag comme ref, pas une branche : le nom du tag sert de version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Les tests posent eux-memes leurs process.env : aucun secret n'est requis.
      - run: npm test

  # La release est creee une seule fois, avant les builds : trois jobs qui
  # tentent de la creer en parallele s'ecraseraient les uns les autres.
  create-release:
    name: creer la release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tag avec suffixe (v0.2.0-beta.1) : prerelease publiee tout de suite,
      # seules les installations beta la voient. Tag stable (v0.1.0) : brouillon,
      # a publier a la main une fois les binaires testes. Tant qu'elle est en
      # brouillon, ni l'auto-update ni releases/latest ne la voient.
      - name: Creer la release si absente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG deja presente, les binaires seront remplaces"
          else
            case "$TAG" in
              *-*) KIND=--prerelease ;;
              *) KIND=--draft ;;
            esac
            gh release create "$TAG" "$KIND" \
              --title "LiveMemes $TAG" \
              --notes-file .github/RELEASE_NOTES.md
          fi

  build:
    name: build ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      # Un echec sur une plateforme ne doit pas priver les autres de binaires.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            ffmpeg: win-x64
          # Les runners macOS sont arm64 : sans les deux arches, aucun binaire
          # pour les Mac Intel.
          - os: macos-latest
            args: '--x64 --arm64'
            ffmpeg: mac-x64 mac-arm64
          - os: ubuntu-latest
            args: ''
            ffmpeg: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # esbuild bundle main/preload/renderers dans dist/, electron-builder
      # n'emballe que ca (plus ffmpeg) : le paquet n'a aucune dependance node_modules.
      - name: Bundle
        working-directory: packages/desktop
        run: npm run build

      # ffmpeg de l'editeur, une copie par arche packagee : electron-builder la
      # reprend depuis vendor/ffmpeg/<os>-<arch> (extraResources).
      - name: ffmpeg
        working-directory: packages/desktop
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.ffmpeg }}

      # Sans drapeau de plateforme, electron-builder cible celle du runner.
      - name: Packager
        working-directory: packages/desktop
        run: npx electron-builder --publish never ${{ matrix.args }}

      - name: Publier les binaires
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.zip
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "aucun binaire produit" >&2
            exit 1
          fi
          # Fichiers lus par electron-updater : latest.yml, latest-mac.yml et
          # latest-linux.yml (meme pour une beta : l'updater cherche d'abord
          # beta*.yml puis se replie sur latest*.yml), plus les .blockmap pour
          # le telechargement differentiel. builder-debug.yml est un fichier de
          # diagnostic, pas un canal.
          for f in packages/desktop/release/*.yml packages/desktop/release/*.blockmap; do
            [ "$(basename "$f")" = builder-debug.yml ] || FILES+=("$f")
          done
          printf 'a publier : %s\n' "${FILES[@]}"
          gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --clobber
