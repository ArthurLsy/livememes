name: release

# Se declenche sur un tag v* (ex. v0.1.0-alpha.1). En manuel, lance le workflow
# en choisissant le tag comme ref, pas une branche : le nom du tag sert de version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Les tests posent eux-memes leurs process.env : aucun secret n'est requis.
      - run: npm test

  windows:
    name: build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # esbuild bundle main/preload/renderers dans dist/, electron-builder
      # n'emballe que ca : le paquet n'a aucune dependance node_modules.
      - name: Bundle
        working-directory: packages/desktop
        run: npm run build

      - name: Packager (nsis + zip)
        working-directory: packages/desktop
        run: npx electron-builder --win --publish never

      # Filet de securite : les binaires restent recuperables meme si la
      # publication de la release echoue.
      - name: Archiver les binaires
        uses: actions/upload-artifact@v4
        with:
          name: livememes-windows
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.zip

      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cat > notes.md <<'EOF'
          Build alpha Windows, non signee : SmartScreen affichera
          "Windows a protege votre ordinateur" au premier lancement
          (Informations complementaires -> Executer quand meme).

          **Installer** : `LiveMemes-*-win-x64.exe` (installeur NSIS, par utilisateur).
          **Sans installer** : `LiveMemes-*-win-x64.zip`, decompresse et lance `LiveMemes.exe`.

          L'app vit dans la zone de notification, pas dans la barre des taches.

          **Il faut un backend joignable depuis le PC Windows.** Dans Reglages,
          le champ Serveur doit pointer sur l'URL publique du backend
          (`http://<ip-lan>:8787` sur le meme reseau, ou l'URL du tunnel).
          `localhost` ne marche que si le backend tourne sur ce PC. Cette meme URL
          doit etre celle de `PUBLIC_URL` cote backend, sinon les commandes
          repondent dans Discord mais aucun meme ne s'affiche.

          Ensuite : `/livememes link` dans Discord, colle le code, puis `/meme`
          depuis un salon vocal.
          EOF

          FILES=(packages/desktop/release/*.exe packages/desktop/release/*.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --prerelease \
              --title "LiveMemes $TAG" \
              --notes-file notes.md
          fi
